[project]
name = "contracts-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing AsyncAPI contracts."
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
contracts-mcp = "contracts_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contracts_mcp"]
