version: "3"

vars:
  # The machinery pin - Renovate bumps this (pypi datasource).
  KIT: catalog-kit==__KIT_VERSION__

tasks:
  ci:
    desc: Full verification - identical locally and in CI
    cmds:
      - defer: { task: mocks:down }
      - task: lint
      - task: check
      - task: mocks:contract
      - task: mocks:test

  check:
    desc: Diff gates and the docs build
    cmds:
      - task: check:version
      - task: check:compat
      - task: check:intent
      - task: docs:build
      - task: docs:diagrams

  check:version:
    desc: Gated artifacts must bump their manifest versions when they change
    cmds:
      - |
        git fetch -q origin main 2>/dev/null || true
        uvx --from {{.KIT}} catalog check version --base "origin/${GITHUB_BASE_REF:-main}"

  check:compat:
    desc: Breaking contract changes must carry a major version bump
    cmds:
      - |
        git fetch -q origin main 2>/dev/null || true
        uvx --from {{.KIT}} catalog check compat --base "origin/${GITHUB_BASE_REF:-main}" {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  check:intent:
    desc: Added schema elements must be named in the service's features
    cmds:
      - |
        git fetch -q origin main 2>/dev/null || true
        uvx --from {{.KIT}} catalog check intent --base "origin/${GITHUB_BASE_REF:-main}" {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  lint:
    desc: Lint specs, features, data contracts and manifests (scope with SERVICE=)
    cmds:
      - task: lint:specs
      - task: lint:features
      - task: lint:datacontracts
      - task: lint:manifest

  lint:specs:
    cmds:
      - uvx --from {{.KIT}} catalog lint specs {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  lint:features:
    cmds:
      - uvx --from {{.KIT}} catalog lint features {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  lint:datacontracts:
    cmds:
      - uvx --from {{.KIT}} catalog lint datacontracts {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  lint:manifest:
    cmds:
      - uvx --from {{.KIT}} catalog lint manifest {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  docs:generate:
    desc: Emit the catalog data the docs site renders from
    run: once
    cmds:
      - uvx --from {{.KIT}} catalog docs data

  docs:diagrams:
    desc: Every mermaid diagram the docs site renders must parse (mermaid-cli)
    deps: [docs:generate]
    cmds:
      - uvx --from {{.KIT}} catalog docs diagrams

  docs:build:
    desc: Build the docs site into ./site
    deps: [docs:generate]
    dir: docs-site
    cmds:
      - |
        if [ -n "$CI" ]; then npm ci; else npm install; fi
      - npm run build

  docs:serve:
    desc: Serve the docs site locally with live reload
    deps: [docs:generate]
    dir: docs-site
    cmds:
      - npm install
      - npm run dev

  mocks:up:
    desc: Start the Microcks mock stack
    run: once
    cmds:
      - uvx --from {{.KIT}} catalog mocks up

  mocks:down:
    desc: Stop the Microcks mock stack
    cmds:
      - uvx --from {{.KIT}} catalog mocks down

  mocks:load:
    desc: Load every service's contracts and examples into Microcks (scope with SERVICE=)
    run: once
    cmds:
      - uvx --from {{.KIT}} catalog mocks load {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  mocks:watch:
    desc: 'Watch a mock event channel (CHANNEL=<Title>/<version>/<operation>)'
    cmds:
      - uvx --from {{.KIT}} catalog mocks watch --channel {{.CHANNEL}}

  mocks:contract:
    desc: Contract-test the running mocks - or a real implementation via REST_ENDPOINT/ASYNC_ENDPOINT overrides
    run: once
    deps: [mocks:load]
    cmds:
      - uvx --from {{.KIT}} catalog mocks contract {{if .SERVICE}}--service {{.SERVICE}}{{end}} {{if .REST_ENDPOINT}}--rest-endpoint {{.REST_ENDPOINT}}{{end}} {{if .ASYNC_ENDPOINT}}--async-endpoint {{.ASYNC_ENDPOINT}}{{end}}

  mocks:test:
    desc: Smoke-test the HTTP and event mocks against the example files
    deps: [mocks:load]
    cmds:
      - uvx --from {{.KIT}} catalog mocks test {{if .SERVICE}}--service {{.SERVICE}}{{end}}
