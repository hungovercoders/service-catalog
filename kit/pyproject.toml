[project]
name = "sysspec"
version = "0.24.0"
description = "System specs first: enforceable system intent (contracts + gherkin) with deterministic gates, generated docs, mocks and read-only MCP access."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "pyyaml>=6.0",
    "websockets>=13.0",
    "jsonschema>=4.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
sysspec = "sysspec.cli:main"
sysspec-mcp = "sysspec_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    "src/sysspec/data/init/docs-site/node_modules",
    "src/sysspec/data/init/docs-site/.astro",
    "src/sysspec/data/init/docs-site/src/data/specs.json",
    "src/sysspec/data/init/docs-site/public/specs",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sysspec", "src/sysspec_mcp"]
