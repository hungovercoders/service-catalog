version: "3"

tasks:
  setup:
    desc: One-shot onboarding - install the pinned toolchain and git hooks
    cmds:
      - mise install
      - git config core.hooksPath .githooks

  check:
    desc: Fast checks (pre-commit tier) - branch name, lint, gated version gate, docs build
    cmds:
      - task: check:branch
      - task: lint
      - task: check:version
      - task: check:plugin
      - task: check:kit
      - task: docs:build
      - task: docs:diagrams

  check:plugin:
    desc: Plugin surface changes (kit, skills, manifests) must bump the plugin version
    cmds:
      - |
        git fetch -q origin main 2>/dev/null || true
        uv run --project kit sysspec check surface --base "origin/${GITHUB_BASE_REF:-main}" \
          --version-file .claude-plugin/plugin.json --paths kit/,skills/,.claude-plugin/,.mcp.json

  check:kit:
    desc: Changes under kit/ must bump the sysspec package version
    cmds:
      - |
        git fetch -q origin main 2>/dev/null || true
        uv run --project kit sysspec check surface --base "origin/${GITHUB_BASE_REF:-main}" \
          --version-file kit/pyproject.toml --json-key project.version --paths kit/

  check:branch:
    desc: Branch name must be main or match the Linear convention (user/gri-123-slug)
    cmds:
      - |
        branch="${GITHUB_HEAD_REF:-$(git branch --show-current)}"
        if [ -z "$branch" ]; then echo "detached HEAD - skipping branch check"; exit 0; fi
        echo "$branch" | grep -qE '^main$|^[A-Za-z0-9._-]+/gri-[0-9]+(-[a-z0-9-]+)*$' \
          || { echo "branch '$branch' does not match Linear convention <user>/gri-<number>-<slug>"; exit 1; }
        echo "branch ok: $branch"

  check:commit:
    desc: Validate a single commit message file (commit-msg hook) against conventional commits
    cmds:
      - |
        head -1 "$MSG_FILE" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+|^(Merge|Revert) ' \
          || { echo "commit message is not a conventional commit (feat:, fix:, docs:, chore:, ...)"; exit 1; }

  check:commits:
    desc: Validate all commit messages ahead of origin/main against conventional commits
    cmds:
      - |
        if [ "$(git branch --show-current)" = "main" ] && [ -z "$GITHUB_HEAD_REF" ]; then echo "on main - skipping range check"; exit 0; fi
        git fetch -q origin main 2>/dev/null || true
        bad=$(git log origin/main..HEAD --format='%s' | grep -vE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+|^(Merge|Revert) ' || true)
        [ -z "$bad" ] || { echo "non-conventional commit messages:"; echo "$bad"; exit 1; }
        echo "commit messages ok ($(git log origin/main..HEAD --oneline | wc -l | tr -d ' ') checked)"

  check:version:
    desc: Gated artifacts (contracts, features) must bump their manifest version when they change
    cmds:
      - |
        git fetch -q origin main 2>/dev/null || true
        uv run --project kit sysspec check version --base "origin/${GITHUB_BASE_REF:-main}"

  docs:generate:
    desc: Emit the spec data the docs site renders from
    run: once
    cmds:
      - uv run --project kit sysspec docs data

  docs:diagrams:
    desc: Every mermaid diagram in the generated docs must parse (mermaid-cli)
    deps: [docs:generate]
    cmds:
      - uv run --project kit sysspec docs diagrams

  docs:build:
    desc: Build the docs site into ./site
    deps: [docs:generate]
    # dir, not npm --prefix: through the docs-site symlink, --prefix makes
    # npm rewrite the lockfile with physical ../kit/... package paths.
    dir: docs-site
    env:
      # docs-site is a symlink into the kit's package data; without the
      # override astro would resolve ../site against the physical path.
      DOCS_SITE_OUT: "{{.ROOT_DIR}}/site"
    cmds:
      - |
        if [ -n "$CI" ]; then npm ci; else npm install; fi
      - npm run build

  docs:serve:
    desc: Serve the docs site locally with live reload
    deps: [docs:generate]
    dir: docs-site
    env:
      DOCS_SITE_OUT: "{{.ROOT_DIR}}/site"
    cmds:
      - npm install
      - npm run dev

  check:compat:
    desc: Breaking contract changes vs origin/main must carry a major version bump
    cmds:
      - |
        git fetch -q origin main 2>/dev/null || true
        uv run --project kit sysspec check compat --base "origin/${GITHUB_BASE_REF:-main}" {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  check:intent:
    desc: Added schema elements vs origin/main must be named in the service's features
    cmds:
      - |
        git fetch -q origin main 2>/dev/null || true
        uv run --project kit sysspec check intent --base "origin/${GITHUB_BASE_REF:-main}" {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  ci:
    desc: Full verification - identical locally and in CI
    cmds:
      - defer: { task: mocks:down }
      - task: check
      - task: check:commits
      - task: check:compat
      - task: check:intent
      - task: check:init
      - task: mocks:load
      - task: mocks:contract
      - task: mocks:test

  check:init:
    desc: The init scaffold must pass its own gates
    cmds:
      - |
        tmp=$(mktemp -d)
        uv run --project kit sysspec init "$tmp" --org com.example
        kit={{.ROOT_DIR}}/kit
        cd "$tmp"
        git init -q . && git add -A && git -c user.email=ci@example.com -c user.name=ci commit -qm "chore: scaffold"
        uv run --project "$kit" sysspec lint specs
        uv run --project "$kit" sysspec lint features
        uv run --project "$kit" sysspec lint datacontracts
        uv run --project "$kit" sysspec lint manifest
        uv run --project "$kit" sysspec check version
        uv run --project "$kit" sysspec docs data
        uv run --project "$kit" sysspec docs diagrams
        cd / && rm -rf "$tmp"

  mocks:up:
    desc: Start the Microcks mock stack
    run: once
    cmds:
      - uv run --project kit sysspec mocks up

  mocks:down:
    desc: Stop the Microcks mock stack
    cmds:
      - uv run --project kit sysspec mocks down

  mocks:load:
    desc: Load every service's contracts and examples into Microcks (scope with SERVICE=)
    run: once
    cmds:
      - uv run --project kit sysspec mocks load {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  mocks:watch:
    desc: 'Watch a mock event channel (CHANNEL=Orders/2.1.0/publishOrderPlaced)'
    cmds:
      - uv run --project kit sysspec mocks watch --channel {{.CHANNEL}}

  mocks:contract:
    desc: Contract-test the running mocks - or a real implementation via REST_ENDPOINT/ASYNC_ENDPOINT overrides
    run: once
    deps: [mocks:load]
    cmds:
      - uv run --project kit sysspec mocks contract {{if .SERVICE}}--service {{.SERVICE}}{{end}} {{if .REST_ENDPOINT}}--rest-endpoint {{.REST_ENDPOINT}}{{end}} {{if .ASYNC_ENDPOINT}}--async-endpoint {{.ASYNC_ENDPOINT}}{{end}}

  mocks:test:
    desc: Smoke-test the HTTP and event mocks against the example files
    deps: [mocks:load]
    cmds:
      - uv run --project kit sysspec mocks test {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  lint:
    desc: Lint specs, feature files, data contracts and manifests (scope with SERVICE=<name>)
    cmds:
      - task: lint:specs
      - task: lint:features
      - task: lint:datacontracts
      - task: lint:manifest

  lint:specs:
    desc: Spectral-lint the OpenAPI and AsyncAPI contracts
    cmds:
      - uv run --project kit sysspec lint specs {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  lint:features:
    desc: Lint the Gherkin acceptance criteria
    cmds:
      - uv run --project kit sysspec lint features {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  lint:datacontracts:
    desc: Lint the ODCS data contracts with datacontract-cli
    cmds:
      - uv run --project kit sysspec lint datacontracts {{if .SERVICE}}--service {{.SERVICE}}{{end}}

  lint:manifest:
    desc: Cross-check manifests against contracts and the spec graph
    cmds:
      - uv run --project kit sysspec lint manifest {{if .SERVICE}}--service {{.SERVICE}}{{end}}
