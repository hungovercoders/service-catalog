version: "3"

vars:
  MICROCKS_URL: http://localhost:8585

tasks:
  setup:
    desc: One-shot onboarding - install the pinned toolchain and git hooks
    cmds:
      - mise install
      - git config core.hooksPath .githooks

  check:
    desc: Fast checks (pre-commit tier) - branch name, lint, gated version gate, docs build
    cmds:
      - task: check:branch
      - task: lint
      - task: check:version
      - task: docs:build

  check:branch:
    desc: Branch name must be main or match the Linear convention (user/gri-123-slug)
    cmds:
      - |
        branch="${GITHUB_HEAD_REF:-$(git branch --show-current)}"
        if [ -z "$branch" ]; then echo "detached HEAD - skipping branch check"; exit 0; fi
        echo "$branch" | grep -qE '^main$|^[A-Za-z0-9._-]+/gri-[0-9]+(-[a-z0-9-]+)*$' \
          || { echo "branch '$branch' does not match Linear convention <user>/gri-<number>-<slug>"; exit 1; }
        echo "branch ok: $branch"

  check:commit:
    desc: Validate a single commit message file (commit-msg hook) against conventional commits
    cmds:
      - |
        head -1 "$MSG_FILE" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+|^(Merge|Revert) ' \
          || { echo "commit message is not a conventional commit (feat:, fix:, docs:, chore:, ...)"; exit 1; }

  check:commits:
    desc: Validate all commit messages ahead of origin/main against conventional commits
    cmds:
      - |
        if [ "$(git branch --show-current)" = "main" ] && [ -z "$GITHUB_HEAD_REF" ]; then echo "on main - skipping range check"; exit 0; fi
        git fetch -q origin main 2>/dev/null || true
        bad=$(git log origin/main..HEAD --format='%s' | grep -vE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+|^(Merge|Revert) ' || true)
        [ -z "$bad" ] || { echo "non-conventional commit messages:"; echo "$bad"; exit 1; }
        echo "commit messages ok ($(git log origin/main..HEAD --oneline | wc -l | tr -d ' ') checked)"

  check:version:
    desc: Gated artifacts (contracts, features) must bump their manifest version when they change
    cmds:
      - |
        git fetch -q origin main 2>/dev/null || true
        uv run --with pyyaml python scripts/check_version_bump.py "origin/${GITHUB_BASE_REF:-main}"

  docs:generate:
    desc: Generate the docs content from the service manifests
    cmds:
      - uv run --with pyyaml python scripts/gen_docs.py
      - |
        for spec in catalog/*/asyncapi/*.yaml; do
          service=$(echo "$spec" | cut -d/ -f2)
          npx -y @asyncapi/cli@5.0.7 generate fromTemplate "$spec" @asyncapi/html-template@3.5.0 \
            --output "docs/services/$service/asyncapi-html" --force-write --param singleFile=true
        done

  docs:build:
    desc: Build the docs site into ./site
    deps: [docs:generate]
    cmds:
      - uvx --with-requirements requirements.docs.txt mkdocs build --strict

  docs:serve:
    desc: Serve the docs site locally with live reload
    deps: [docs:generate]
    cmds:
      - uvx --with-requirements requirements.docs.txt mkdocs serve

  check:compat:
    desc: Breaking contract changes vs origin/main must carry a major version bump
    cmds:
      - |
        git fetch -q origin main 2>/dev/null || true
        uv run --with pyyaml python scripts/check_compat.py "origin/${GITHUB_BASE_REF:-main}" {{.SERVICE}}

  ci:
    desc: Full verification - identical locally and in CI
    cmds:
      - defer: { task: mocks:down }
      - task: check
      - task: check:commits
      - task: check:compat
      - task: mocks:load
      - task: mocks:test

  mocks:up:
    desc: Start the Microcks mock stack
    run: once
    cmds:
      - docker compose -f mocks/docker-compose.yml up -d --wait

  mocks:down:
    desc: Stop the Microcks mock stack
    cmds:
      - docker compose -f mocks/docker-compose.yml down

  mocks:load:
    desc: Load every service's contracts and examples into Microcks (scope with SERVICE=)
    run: once
    deps: [mocks:up]
    cmds:
      - |
        for manifest in catalog/{{.SERVICE | default "*"}}/service.yaml; do
          dir=$(dirname "$manifest"); name=$(basename "$dir")
          for spec in "$dir"/asyncapi/*.yaml "$dir"/openapi/*.yaml; do
            [ -f "$spec" ] || continue
            echo "loading $spec"
            curl -sf -F "file=@$spec" '{{.MICROCKS_URL}}/api/artifact/upload?mainArtifact=true' > /dev/null
          done
          for examples in mocks/"$name".*.examples.yaml; do
            [ -f "$examples" ] || continue
            echo "loading $examples"
            curl -sf -F "file=@$examples" '{{.MICROCKS_URL}}/api/artifact/upload?mainArtifact=false' > /dev/null
          done
        done
      - docker compose -f mocks/docker-compose.yml restart async-minion
      - |
        for i in $(seq 1 30); do
          code=$(curl -s --max-time 3 -o /dev/null -w '%{http_code}' http://localhost:8081/health || true)
          if [ "$code" != "000" ]; then echo "async-minion http up (after $i checks)"; exit 0; fi
          sleep 2
        done
        echo "async-minion not responding after 60s"; exit 1

  mocks:watch:
    desc: 'Watch a mock event channel (CHANNEL=Orders/1.4.0/publishOrderPlaced)'
    cmds:
      - npx -y wscat@6.1.0 -c 'ws://localhost:8081/api/ws/{{.CHANNEL}}'

  mocks:test:
    desc: Smoke-test the HTTP and event mocks
    deps: [mocks:load]
    cmds:
      - |
        base='{{.MICROCKS_URL}}'/rest/$(curl -s '{{.MICROCKS_URL}}/api/services' \
          | jq -r '.[] | select(.name=="Orders API") | .name + "/" + .version' | tr ' ' '+')
        body=$(mktemp)
        code=$(curl -s -o "$body" -w '%{http_code}' -X POST "$base/orders" \
          -H 'Content-Type: application/json' \
          -d '{"customerId":"22222222-2222-2222-2222-222222222222","lines":[{"sku":"SKU-001","quantity":2,"unitPricePence":1250}]}')
        [ "$code" = "201" ] || { echo "place order: expected 201, got $code"; exit 1; }
        jq -e .orderId "$body" > /dev/null || { echo "place order: no orderId in body"; exit 1; }
        status=$(curl -sf "$base/orders/11111111-1111-1111-1111-111111111111" | jq -r .status)
        [ "$status" = "placed" ] || { echo "fixture order: expected placed, got $status"; exit 1; }
        rm -f "$body"; echo "rest mocks ok: POST -> 201 with orderId, fixture -> placed"
      - |
        for svc in Orders/publishOrderPlaced Payments/publishPaymentSettled; do
          name=${svc%%/*}; op=${svc##*/}
          version=$(curl -s '{{.MICROCKS_URL}}/api/services' | jq -r ".[] | select(.name==\"$name\") | .version")
          node -e "
          const ws = new WebSocket('ws://localhost:8081/api/ws/$name/$version/$op');
          ws.onmessage = e => { JSON.parse(e.data); console.log('event mocks ok: $name/$op'); process.exit(0); };
          ws.onerror = () => { console.error('$name/$op: ws error'); process.exit(1); };
          setTimeout(() => { console.error('$name/$op: no event within 20s'); process.exit(1); }, 20000);
          " || exit 1
        done

  lint:
    desc: Lint specs, feature files and manifests (scope with SERVICE=<name>)
    cmds:
      - task: lint:specs
      - task: lint:features
      - task: lint:manifest

  lint:specs:
    desc: Spectral-lint the OpenAPI and AsyncAPI contracts
    cmds:
      - |
        files=$(/bin/ls catalog/{{.SERVICE | default "*"}}/asyncapi/*.yaml catalog/{{.SERVICE | default "*"}}/openapi/*.yaml 2>/dev/null || true)
        [ -n "$files" ] || { echo "no specs found for '{{.SERVICE | default "*"}}'"; exit 1; }
        npx -y @stoplight/spectral-cli@6.16.3 lint $files --fail-severity=warn

  lint:features:
    desc: Lint the Gherkin acceptance criteria
    cmds:
      - npx -y gherkin-lint@4.2.4 catalog/{{.SERVICE | default "*"}}/features

  lint:manifest:
    desc: Cross-check manifests against contracts and the catalog graph
    cmds:
      - uv run --with pyyaml python scripts/lint_manifest.py {{.SERVICE}}
