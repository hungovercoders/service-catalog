asyncapi: 3.0.0
info:
  title: Payments
  version: 0.7.0
  description: >
    Payment lifecycle events. PaymentSettled is the only event safe to
    treat as terminal; authorisation may still be reversed.
  contact:
    name: team-payments
    url: https://github.com/hungovercoders
    email: team-payments@hungovercoders.com
  tags:
    - name: payments

defaultContentType: application/json

channels:
  paymentSettled:
    address: payments.settled.v1
    bindings:
      ws: {}
    messages:
      PaymentSettled:
        $ref: '#/components/messages/PaymentSettled'

operations:
  publishPaymentSettled:
    action: send
    description: Emitted once funds have irrevocably settled for an order.
    channel:
      $ref: '#/channels/paymentSettled'
    messages:
      - $ref: '#/channels/paymentSettled/messages/PaymentSettled'

components:
  messages:
    PaymentSettled:
      name: PaymentSettled
      title: Payment settled
      payload:
        type: object
        required: [paymentId, orderId, settledAt, amountPence]
        additionalProperties: false
        properties:
          paymentId: { type: string, format: uuid }
          orderId: { type: string, format: uuid }
          settledAt: { type: string, format: date-time }
          amountPence: { type: integer, minimum: 0 }
