asyncapi: 3.0.0
info:
  title: Orders
  version: 1.3.0
  description: >
    Events emitted by the Orders aggregate. Consumers must not assume
    ordering across channels, only within a partition key of orderId.
  contact:
    name: team-commerce
    url: https://github.com/hungovercoders
    email: team-commerce@hungovercoders.com
  tags:
    - name: orders

defaultContentType: application/json

channels:
  orderPlaced:
    address: orders.placed.v1
    messages:
      OrderPlaced:
        $ref: '#/components/messages/OrderPlaced'
  orderCancelled:
    address: orders.cancelled.v1
    messages:
      OrderCancelled:
        $ref: '#/components/messages/OrderCancelled'

operations:
  publishOrderPlaced:
    action: send
    description: Emitted when an order is accepted and persisted.
    channel:
      $ref: '#/channels/orderPlaced'
  publishOrderCancelled:
    action: send
    description: Emitted when an order is cancelled, with the reason.
    channel:
      $ref: '#/channels/orderCancelled'

components:
  messages:
    OrderPlaced:
      name: OrderPlaced
      title: Order placed
      payload:
        type: object
        required: [orderId, customerId, placedAt, totalPence]
        additionalProperties: false
        properties:
          orderId: { type: string, format: uuid }
          customerId: { type: string, format: uuid }
          placedAt: { type: string, format: date-time }
          totalPence: { type: integer, minimum: 0 }
    OrderCancelled:
      name: OrderCancelled
      title: Order cancelled
      payload:
        type: object
        required: [orderId, cancelledAt, reason]
        additionalProperties: false
        properties:
          orderId: { type: string, format: uuid }
          cancelledAt: { type: string, format: date-time }
          reason:
            type: string
            enum: [customer_request, payment_failed, out_of_stock]
