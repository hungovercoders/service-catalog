apiVersion: catalog/v1
kind: Service
name: orders
title: Orders
version: 3.0.0
domain: Commerce
owner: team-commerce
summary: >
  Owns the Order aggregate. Accepts order placement over HTTP, emits
  lifecycle events, and consumes payment settlement to close orders out.

artifacts:
  - kind: asyncapi
    path: asyncapi/orders.asyncapi.yaml
    version: 3.0.0
    gated: true
    summary: Events emitted and consumed by the Order aggregate.

  - kind: openapi
    path: openapi/orders.openapi.yaml
    version: 3.0.0
    gated: true
    summary: Synchronous order placement and lookup API.

  - kind: feature
    path: features/place-order.feature
    version: 2.0.0
    gated: true
    summary: Acceptance criteria for order placement, including the outbox.

  - kind: data-contract
    path: data-contracts/orders-events.odcs.yaml
    version: 1.2.0
    gated: true
    summary: Append-only historical record of the order lifecycle events.

  - kind: doc
    path: docs/adr-001-outbox.md
    gated: false
    summary: Why placement writes order and event in one transaction.

  - kind: doc
    path: docs/runbook.md
    gated: false
    summary: On-call procedures for stuck outbox rows.

produces:
  - orders.placed.v2
  - orders.cancelled.v2

consumes:
  - payments.settled.v2
