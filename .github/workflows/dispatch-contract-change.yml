name: dispatch-contract-change
on:
  push:
    branches: [main]
    paths: ["catalog/**"]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dispatch to each changed service's implementation repo
        env:
          TOKEN: ${{ secrets.CONTRACTS_DISPATCH_TOKEN }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          services=$(git diff --name-only "$BEFORE" "$SHA" -- catalog/ | cut -d/ -f2 | sort -u)
          [ -n "$services" ] || { echo "no catalog changes"; exit 0; }
          for service in $services; do
            manifest="catalog/$service/service.yaml"
            [ -f "$manifest" ] || { echo "::warning::$service removed or has no manifest - skipping"; continue; }
            repo=$(awk '/^implementationRepo:/{print $2; exit}' "$manifest")
            if [ -z "$repo" ]; then
              echo "::warning::$service has no implementationRepo in its manifest - implementation not notified"
              continue
            fi
            if [ -z "$TOKEN" ]; then
              echo "::warning::CONTRACTS_DISPATCH_TOKEN not set - $repo not notified of $service contract change"
              continue
            fi
            curl -sf -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$repo/dispatches" \
              -d "{\"event_type\":\"contract-changed\",\"client_payload\":{\"contract_ref\":\"$SHA\",\"service\":\"$service\"}}"
            echo "dispatched contract-changed for $service -> $repo @ $SHA"
          done
