# Reusable GitHub Pages deploy for a service-catalog repo's generated docs.
#
# Consumers (the caller must grant the permissions):
#   permissions: { contents: read, pages: write, id-token: write }
#   jobs:
#     deploy:
#       uses: hungovercoders/service-catalog/.github/workflows/catalog-pages.yml@v1
name: catalog-pages

on:
  workflow_call:
    inputs:
      docs-task:
        description: The task target that builds the site
        type: string
        default: docs:build
      site-dir:
        description: Directory the site is built into
        type: string
        default: site

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: task ${{ inputs.docs-task }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ inputs.site-dir }}
      - id: deployment
        uses: actions/deploy-pages@v4
