apiVersion: mocks.microcks.io/v1alpha1
kind: APIExamples
metadata:
  name: Orders API
  version: 2.1.0
operations:
  'POST /orders':
    placed:
      request:
        headers:
          Content-Type: application/json
        body: |-
          {
            "customerId": "22222222-2222-2222-2222-222222222222",
            "lines": [
              { "sku": "SKU-001", "quantity": 2, "unitPricePence": 1250 }
            ]
          }
      response:
        status: "201"
        mediaType: application/json
        body: |-
          {
            "orderId": "11111111-1111-1111-1111-111111111111",
            "customerId": "22222222-2222-2222-2222-222222222222",
            "status": "placed",
            "totalPence": 2500
          }
  'GET /orders/{orderId}':
    placed:
      request:
        parameters:
          orderId: 11111111-1111-1111-1111-111111111111
      response:
        status: "200"
        mediaType: application/json
        body: |-
          {
            "orderId": "11111111-1111-1111-1111-111111111111",
            "customerId": "22222222-2222-2222-2222-222222222222",
            "status": "placed",
            "totalPence": 2500
          }
