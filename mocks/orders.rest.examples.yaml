apiVersion: mocks.microcks.io/v1alpha1
kind: APIExamples
metadata:
  name: Orders API
  version: 3.1.0
operations:
  'POST /orders':
    placed:
      request:
        headers:
          Content-Type: application/json
        body: |-
          {
            "customer_id": "22222222-2222-2222-2222-222222222222",
            "lines": [
              { "sku": "SKU-001", "quantity": 2, "unit_price_pence": 1250 }
            ]
          }
      response:
        status: "201"
        mediaType: application/json
        body: |-
          {
            "order_id": "11111111-1111-1111-1111-111111111111",
            "customer_id": "22222222-2222-2222-2222-222222222222",
            "status": "placed",
            "total_pence": 2500
          }
  'GET /orders/{order_id}':
    placed:
      request:
        parameters:
          order_id: 11111111-1111-1111-1111-111111111111
      response:
        status: "200"
        mediaType: application/json
        body: |-
          {
            "order_id": "11111111-1111-1111-1111-111111111111",
            "customer_id": "22222222-2222-2222-2222-222222222222",
            "status": "placed",
            "total_pence": 2500
          }
